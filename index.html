<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Advanced AI SAAS Terminal PRO</title>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle at top,#0a1020,#05070f);
color:white;
overflow-x:hidden;
}

/* BACKGROUND EFFECT */
.bg{
position:fixed;
width:100%;
height:100%;
background:radial-gradient(circle at 20% 20%,rgba(0,120,255,0.18),transparent),
radial-gradient(circle at 80% 80%,rgba(180,0,255,0.12),transparent);
animation:move 10s infinite alternate;
z-index:-1;
}

@keyframes move{
from{transform:scale(1);}
to{transform:scale(1.2);}
}

/* LOGIN */
.login{
max-width:380px;
margin:70px auto;
background:#111a2d;
padding:20px;
border-radius:14px;
box-shadow:0 0 20px rgba(0,80,255,0.2);
}

input{
width:100%;
padding:12px;
margin:6px 0;
border-radius:8px;
border:none;
background:#0b1222;
color:white;
outline:none;
}

button{
width:100%;
padding:12px;
margin-top:8px;
border:none;
border-radius:8px;
background:linear-gradient(90deg,#2f6fff,#5aa0ff);
color:white;
font-weight:bold;
cursor:pointer;
}

/* APP */
.app{
display:none;
max-width:1000px;
margin:auto;
padding:20px;
}

/* TOP BAR */
.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.badge{
background:#1f6fff;
padding:6px 10px;
border-radius:20px;
font-size:12px;
}

/* LAYOUT */
.grid{
display:grid;
grid-template-columns:1fr 260px;
gap:12px;
}

/* TERMINAL */
.terminal{
background:#0f1a30;
padding:12px;
border-radius:12px;
border:1px solid #26344f;
}

.card{
background:#0e1a30;
padding:10px;
margin-top:10px;
border-radius:10px;
border:1px solid #26344f;
animation:fade .2s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(8px);}
to{opacity:1;transform:translateY(0);}
}

/* HISTORY */
.history{
background:#0b1425;
padding:10px;
border-radius:10px;
height:420px;
overflow:auto;
border:1px solid #26344f;
}

.item{
font-size:12px;
padding:6px;
border-bottom:1px solid #1f2b44;
cursor:pointer;
}

.item:hover{
background:#14223d;
}

/* ACTIONS */
.actions{
display:flex;
gap:10px;
margin-top:10px;
}

.actions button{
flex:1;
font-size:12px;
}

/* WARNING */
.warn{
color:#ff4d4d;
margin-top:10px;
}

/* PREMIUM BUTTON */
.premiumBtn{
position:fixed;
top:10px;
right:10px;
background:linear-gradient(90deg,#ffb300,#ff3d81);
border:none;
padding:10px 14px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

/* PREMIUM PANEL */
.panel{
position:fixed;
top:60px;
right:10px;
width:260px;
background:#111a2d;
padding:12px;
border-radius:12px;
display:none;
}

.plan{
background:#0f1a30;
padding:10px;
border-radius:10px;
margin-bottom:8px;
border:1px solid #26344f;
}

.plan button{
margin-top:6px;
font-size:12px;
}

/* ============================= */
/* ONLY ADDITION (AS REQUESTED)  */
/* MINI PREMIUM BOX              */
/* ============================= */

.miniPremium{
position:fixed;
top:10px;
left:10px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
padding:8px 12px;
border-radius:10px;
border:1px solid rgba(255,255,255,0.2);
font-size:12px;
color:white;
z-index:9999;
}
</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="bg"></div>

<!-- ONLY ADDITION (MINI PREMIUM BOX) -->
<div class="miniPremium">
💎 Premium: Click Top Right
</div>

<!-- PREMIUM BUTTON -->
<button class="premiumBtn" onclick="togglePremium()">💎 Premium</button>

<!-- PREMIUM PANEL -->
<div class="panel" id="panel">

<div class="plan">
7 Days - ₹100
<button onclick="buy('100')">Buy</button>
</div>

<div class="plan">
1 Month - ₹200
<button onclick="buy('200')">Buy</button>
</div>

<div class="plan">
2 Months - ₹500
<button onclick="buy('500')">Buy</button>
</div>

<div class="plan">
Lifetime - ₹3000
<button onclick="buy('3000')">Buy</button>
</div>

</div>

<!-- LOGIN -->
<div class="login" id="loginBox">
<h3>LOGIN / REGISTER</h3>

<input id="u" placeholder="username"/>
<input id="p" placeholder="password"/>

<button onclick="register()">REGISTER</button>
<button onclick="login()">LOGIN</button>
</div>

<!-- APP -->
<div class="app" id="app">

<div class="top">
<h3>AI TERMINAL PRO</h3>
<div class="badge" id="credits">Credits: 3</div>
</div>

<div class="grid">

<!-- TERMINAL -->
<div class="terminal">

<input id="q" placeholder="Enter number / query"/>
<button onclick="search()">RUN QUERY</button>

<div id="out"></div>

<div class="actions">
<button onclick="copy()">COPY</button>
<button onclick="download()">EXPORT</button>
<button onclick="clearAll()">CLEAR</button>
</div>

<div id="msg" class="warn"></div>

</div>

<!-- HISTORY -->
<div class="history" id="history">
<b>History</b>
</div>

</div>

</div>

<script>

let db = JSON.parse(localStorage.getItem("db") || "{}");

let user=null;
let credits=3;
let history=[];

const API="https://vernex-1.onrender.com/api/numinfo?num=";

/* REGISTER */
function register(){

db[u.value]={
pass:p.value,
credits:3
};

localStorage.setItem("db",JSON.stringify(db));

alert("Registered + 3 Credits");
}

/* LOGIN */
function login(){

if(!db[u.value] || db[u.value].pass!==p.value){
alert("Invalid login");
return;
}

user=u.value;
credits=db[u.value].credits;

document.getElementById("loginBox").style.display="none";
document.getElementById("app").style.display="block";
}

/* SEARCH */
async function search(){

let msg=document.getElementById("msg");
let out=document.getElementById("out");

msg.innerText="";

if(!q.value){
msg.innerText="Enter input";
return;
}

if(credits<=0){
out.innerHTML=`<div class="card">LIMIT FINISHED → BUY PREMIUM</div>`;
return;
}

credits--;
db[user].credits=credits;
localStorage.setItem("db",JSON.stringify(db));

try{

const res=await fetch(API+q.value);
const data=await res.json();

out.innerHTML="";

for(let k in data){
out.innerHTML+=`
<div class="card">
<b>${k}</b><br>
${typeof data[k]==="object"
? JSON.stringify(data[k],null,2)
: data[k]}
</div>`;
}

history.unshift(q.value);

}catch(e){
out.innerHTML=`<div class="card">API ERROR</div>`;
}

}

/* PREMIUM */
function togglePremium(){
let p=document.getElementById("panel");
p.style.display=(p.style.display==="block")?"none":"block";
}

function buy(amount){
alert("Redirecting ₹"+amount);
window.open("https://www.phonepe.com/business-solutions/","_blank");
}

function copy(){
navigator.clipboard.writeText(document.getElementById("out").innerText);
alert("Copied");
}

function download(){
const blob=new Blob([document.getElementById("out").innerText]);
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="result.txt";
a.click();
}

function clearAll(){
document.getElementById("out").innerHTML="";
}

</script>

</body>
</html>
